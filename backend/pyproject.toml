[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modviirs-backend"
version = "0.1.0"
description = "API de MODVIIRS"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
    "polars>=1.0",
    "pyarrow>=10.0",
    "requests>=2.32",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "flasgger>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Reference copies of the data pipeline (notebooks and one-off scripts), not part of the package.
extend-exclude = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The Swagger docstrings are long YAML descriptions.
"src/modviirs/api/*.py" = ["E501"]
